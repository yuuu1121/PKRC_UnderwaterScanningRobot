<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PKRC 관제</title>
</head>
<body>
<!-- 한 화면에 전부 담는 3열 그리드. 스크롤은 게인 슬라이더 목록에만 있다
     (파라미터가 35개라 어떤 레이아웃에도 안 들어간다). 나머지는 뷰포트
     높이에 맞춰 줄어든다. -->
<div id="app">

  <header id="bar">
    <strong>PKRC 관제</strong>
    <span id="cam-status">영상 수신 대기…</span>
  </header>

  <!-- 좌: 카메라 + 조종 -->
  <section class="panel" id="col-left">
    <div id="cam-wrap">
      <img id="cam" src="/stream" alt="레이저 카메라">
    </div>
    <div id="cam-ctrl">
      <label>노출 <input type="range" id="cam-exp" min="1" max="5000"
             step="1" value="50">
        <input type="number" id="cam-exp-v" min="1" max="5000" step="1"
               value="50"></label>
      <label>감마 <input type="range" id="cam-gam" min="72" max="500"
             step="1" value="100">
        <input type="number" id="cam-gam-v" min="72" max="500" step="1"
               value="100"></label>
    </div>
    <div id="pad">
      <div class="row">
        <button data-key="LEFT" data-hold="1">←</button>
        <button data-key="UP" data-hold="1">↑</button>
        <button data-key="RIGHT" data-hold="1">→</button>
      </div>
      <div class="row">
        <button data-key="a" data-hold="1">A ↺</button>
        <button data-key="DOWN" data-hold="1">↓</button>
        <button data-key="d" data-hold="1">D ↻</button>
      </div>
      <div class="row">
        <button data-key="w">W 상승</button>
        <button data-key="s">S 하강</button>
        <button data-key="x" class="stop">X 정지</button>
      </div>
      <div class="row">
        <button data-key="r">R 방위</button>
        <button data-key="t">T 수심</button>
        <button data-key="c">C 벽정렬</button>
      </div>
      <div class="hint">키보드로도 조종 가능 (↑↓←→ A D W S R T C X)</div>
    </div>
  </section>

  <!-- 중: 노드 + 상태 수치 -->
  <section class="panel" id="col-mid">
    <h2>노드</h2>
    <div id="nodes"></div>
    <h2>상태</h2>
    <table id="nums">
      <tr><th>방위 목표</th><td id="v-yaw-t">–</td>
          <th>현재</th><td id="v-yaw-c">–</td>
          <th>오차</th><td id="v-yaw-e">–</td></tr>
      <tr><th>수심 목표</th><td id="v-dep-t">–</td>
          <th>현재</th><td id="v-dep-c">–</td>
          <th>압력</th><td id="v-pres">–</td></tr>
      <tr><th>DVL surge</th><td id="v-dvl-x">–</td>
          <th>sway</th><td id="v-dvl-y">–</td>
          <th>pitch</th><td id="v-pitch">–</td></tr>
      <tr><th>소나 거리</th><td id="v-sonar">–</td>
          <th>신뢰도</th><td id="v-conf">–</td>
          <th>벽정렬</th><td id="v-wmode">–</td></tr>
    </table>
    <div id="thrusters"></div>
    <canvas id="chart" width="440" height="90"></canvas>
    <p class="legend"><span style="color:#4af">■</span> 방위 오차 [°]
       <span style="color:#fa4">■</span> 수심 오차 [m] · 최근 30초</p>
  </section>

  <!-- 우: 게인 튜닝 (슬라이더 목록만 스크롤) -->
  <section class="panel" id="col-right">
    <h2>게인 튜닝</h2>
    <div id="preset-box">
      <input id="preset-name" placeholder="프리셋 이름" size="10">
      <button id="preset-save">저장</button>
      <select id="preset-sel"></select>
      <button id="preset-load">불러오기</button>
    </div>
    <p id="preset-msg"></p>
    <p id="tune-status">조종 노드를 켜면 게인 슬라이더가 나타납니다.</p>
    <div id="sliders"></div>
  </section>

</div>
<style>
  /* 단일 액센트(#4af) + 위험색(#f55/#833)만 쓴다. 색을 늘리면 포화·사망
     표시가 장식과 구별되지 않는다. */
  :root {
    --bg: #111; --panel: #181818; --line: #333; --fg: #eee;
    --dim: #999; --accent: #4af; --warn: #f80; --bad: #f55;
    --gap: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, sans-serif; font-size: 13px;
    background: var(--bg); color: var(--fg);
    overflow: hidden;            /* 페이지 스크롤 금지 — 한 화면에 담는다 */
  }

  /* 헤더 한 줄 + 3열 본문. 본문 행이 남은 높이를 전부 차지한다. */
  #app {
    height: 100dvh; display: grid; gap: var(--gap); padding: var(--gap);
    grid-template-columns: minmax(260px, 22%) minmax(380px, 1fr) minmax(300px, 26%);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "bar bar bar" "left mid right";
  }
  #bar { grid-area: bar; display: flex; align-items: baseline; gap: 1rem; }
  #bar strong { letter-spacing: .04em; }
  #col-left { grid-area: left; }
  #col-mid { grid-area: mid; }
  #col-right { grid-area: right; }

  /* minmax(0,…) 없이는 자식이 패널을 밀어내 페이지가 스크롤된다. */
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: var(--gap);
    min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; gap: 6px;
  }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase;
       letter-spacing: .08em; color: var(--dim); margin: 0; }

  /* ── 카메라 ── 남는 높이만 쓰고, 부족하면 먼저 줄어든다. */
  #cam-wrap { flex: 1 1 auto; min-height: 0; display: flex;
              align-items: center; justify-content: center;
              background: #000; border: 1px solid var(--line);
              border-radius: 4px; overflow: hidden; }
  #cam { max-width: 100%; max-height: 100%; object-fit: contain; }
  #cam-status { color: var(--warn); font-size: 12px; }

  /* ── 조종 패드 ── 눌러야 하는 버튼이라 최소 크기를 지킨다. */
  #pad { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; }
  #pad .row { display: flex; gap: 4px; }
  #pad button { flex: 1; padding: 10px 4px; font-size: 13px; cursor: pointer;
                background: #2a2a2a; color: var(--fg);
                border: 1px solid #444; border-radius: 4px;
                touch-action: none; }
  #pad button:active { background: #06c; border-color: var(--accent); }
  /* 물리 키보드로 눌렀을 때도 마우스와 같게 보이도록 */
  #pad button.kbd { background: #06c; border-color: var(--accent); }
  #pad button.stop { background: #833; border-color: #a44; }
  #pad .hint { color: var(--dim); font-size: 10px; text-align: center; }

  /* ── 카메라 노출·감마 ── 화면 바로 아래, 한 줄씩 */
  #cam-ctrl { flex: 0 0 auto; display: flex; flex-direction: column;
              gap: 2px; }
  #cam-ctrl label { display: flex; align-items: center; gap: 5px;
                    font-size: 10px; color: var(--dim); }
  #cam-ctrl input[type=range] { flex: 1; accent-color: var(--accent);
                                margin: 0; }
  #cam-ctrl input[type=number] { width: 3.6rem; background: #222;
    color: var(--fg); border: 1px solid #444; border-radius: 3px;
    padding: 1px 3px; font-size: 10px;
    font-variant-numeric: tabular-nums; }

  /* ── 노드 토글 ── */
  #nodes { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; }
  .nodegrp { border: 1px solid var(--line); border-radius: 4px;
             padding: 4px 6px; margin: 0; display: flex;
             flex-wrap: wrap; gap: 4px; align-items: center; }
  .nodegrp legend { color: var(--dim); font-size: 10px; padding: 0 4px; }
  .nodebtn { padding: 4px 8px; font-size: 12px; cursor: pointer;
             background: #2a2a2a; color: var(--fg);
             border: 1px solid #444; border-radius: 3px; }
  .nodebtn.on { background: #0a5c2a; border-color: #17a34a; }
  .nodegrp label { font-size: 11px; color: var(--dim); }
  .nodegrp input[type=number] { width: 3.6rem; background: #222;
    color: var(--fg); border: 1px solid #444; border-radius: 3px;
    padding: 2px 4px; }
  #led-wrap { display: inline-flex; align-items: center; gap: 4px; }
  #led { width: 90px; accent-color: var(--accent); }
  #led:disabled { opacity: .4; }
  #led-val { width: 2.2rem; font-variant-numeric: tabular-nums;
             font-size: 11px; color: var(--fg); }

  /* ── 상태 수치 ── */
  #nums { flex: 0 0 auto; border-collapse: collapse; width: 100%;
          font-size: 12px; }
  #nums th, #nums td { border: 1px solid var(--line); padding: 2px 6px;
                       font-variant-numeric: tabular-nums; }
  #nums th { background: #202020; color: var(--dim); font-weight: 400;
             text-align: left; white-space: nowrap; }
  #nums td { text-align: right; }

  /* ── 스러스터 바 ── track 을 flex 로 늘려 폭을 화면에 맞춘다. */
  #thrusters { flex: 0 0 auto; display: flex; flex-direction: column;
               gap: 2px; }
  .tbar { display: flex; align-items: center; gap: 6px; }
  .tbar .name { width: 1.8rem; color: var(--dim); font-size: 11px; }
  .tbar .track { position: relative; flex: 1; height: 11px;
                 background: #222; border: 1px solid var(--line);
                 border-radius: 2px; overflow: hidden; }
  .tbar .fill { position: absolute; top: 0; bottom: 0; left: 50%;
                background: var(--accent); }
  .tbar .val { width: 3.4rem; text-align: right; font-size: 11px;
               font-variant-numeric: tabular-nums; }

  #chart { flex: 0 0 auto; width: 100%; height: 90px;
           background: #141414; border: 1px solid var(--line);
           border-radius: 4px; }
  .legend { color: #777; font-size: 10px; margin: 0; }

  /* ── 게인 튜닝 ── 이 목록만 스크롤한다(파라미터 35개). */
  #sliders { flex: 1 1 auto; min-height: 0; overflow-y: auto;
             padding-right: 4px; }
  #sliders::-webkit-scrollbar { width: 8px; }
  #sliders::-webkit-scrollbar-thumb { background: #3a3a3a;
                                      border-radius: 4px; }
  .slider { display: grid; grid-template-columns: 1fr 4.6rem;
            gap: 2px 6px; align-items: center; margin-bottom: 5px; }
  .slider label { grid-column: 1 / -1; font-size: 10px; color: var(--dim);
                  font-family: ui-monospace, monospace; }
  .slider input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  .slider input[type=number] { width: 100%; background: #222; color: var(--fg);
    border: 1px solid #444; border-radius: 3px; padding: 1px 3px;
    font-size: 11px; }

  #preset-box { flex: 0 0 auto; display: flex; gap: 4px;
                align-items: center; flex-wrap: wrap; }
  #preset-box input, #preset-box select, #preset-box button {
    background: #222; color: var(--fg); border: 1px solid #444;
    border-radius: 3px; padding: 3px 5px; font-size: 11px; }
  #preset-box button { cursor: pointer; }
  #preset-box select { max-width: 7rem; }
  #preset-msg, #tune-status { color: #8a8; font-size: 11px; margin: 0; }
  .msg-err { color: #f77 !important; }
  .dead { color: var(--bad) !important; }

  /* 좁은 화면(1366px 이하 노트북)에서는 2열로 접고, 게인 열이 아래로 간다. */
  @media (max-width: 1200px) {
    #app { grid-template-columns: minmax(240px, 34%) 1fr;
           grid-template-rows: auto 1fr 1fr;
           grid-template-areas: "bar bar" "left mid" "left right"; }
  }
</style>
<script>
  // 영상이 실제로 오는지 img 이벤트로 판단한다. 검은 화면만 보이면
  // 원인을 알 수 없으므로 상태를 글자로 명시한다.
  const img = document.getElementById('cam');
  const status = document.getElementById('cam-status');
  img.addEventListener('load', () => { status.textContent = ''; });
  img.addEventListener('error', () => {
    status.textContent =
      '영상 없음 — laser_camera_publisher 가 떠 있는지 확인하세요.';
  });

  // 누르고 있는 동안 20Hz 로 키를 반복 전송한다. 노드가 0.4초 auto-repeat
  // 타임아웃을 전제로 만들어져 있어(key_timeout) 이 방식이 그대로 맞는다.
  // 떼면 전송이 멈추고 노드가 자연 decay 한다.
  const HOLD_HZ = 20;
  let holdTimer = null;

  function sendKey(key) {
    fetch('/key', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: key}),
    }).catch(() => {});   // 통신 실패는 서버 watchdog 이 처리한다
  }

  function startHold(key) {
    stopHold();
    sendKey(key);
    holdTimer = setInterval(() => sendKey(key), 1000 / HOLD_HZ);
  }

  function stopHold() {
    if (holdTimer !== null) { clearInterval(holdTimer); holdTimer = null; }
  }

  document.querySelectorAll('#pad button').forEach(btn => {
    const key = btn.dataset.key;
    if (btn.dataset.hold) {
      // 누르는 동안 반복. pointer 이벤트로 마우스·터치를 함께 처리.
      btn.addEventListener('pointerdown', e => {
        e.preventDefault(); startHold(key);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
        btn.addEventListener(ev, stopHold));
    } else {
      btn.addEventListener('click', () => sendKey(key));
    }
  });

  // 탭이 숨겨지면 즉시 전송을 멈춘다 — 서버 watchdog 이 0.5초 후 정지시킨다.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopHold();
  });
  window.addEventListener('blur', stopHold);

  // ── 물리 키보드 입력 ────────────────────────────────────────────
  // 원래 터미널에서 키보드로 조종하던 장비라 같은 키를 그대로 쓴다.
  // 버튼과 동일 경로(sendKey/startHold)를 지나므로 watchdog 보호도 같다.
  const KEYMAP = {
    ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT',
    a: 'a', d: 'd', w: 'w', s: 's', r: 'r', t: 't', c: 'c', x: 'x',
  };
  // 누르고 있어야 하는 키(방향·회전)와 한 번만 보내는 키를 구분한다.
  // 버튼의 data-hold 와 같은 구분이다.
  const HOLD_KEYS = new Set(['UP', 'DOWN', 'LEFT', 'RIGHT', 'a', 'd']);
  let heldKey = null;

  function keyOf(e) {
    // 화살표는 e.key 그대로, 문자는 소문자로 정규화(Shift 눌러도 동작).
    return KEYMAP[e.key] || KEYMAP[e.key.toLowerCase()] || null;
  }

  document.addEventListener('keydown', e => {
    // 입력창(프리셋 이름·전류 한계·슬라이더)에 타이핑 중이면 조종하지 않는다.
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;   // 브라우저 단축키 보존

    const key = keyOf(e);
    if (!key) return;
    e.preventDefault();          // 화살표로 페이지가 스크롤되지 않게

    if (HOLD_KEYS.has(key)) {
      // OS 자동반복이 keydown 을 연달아 쏘지만 startHold 가 이미 20Hz 로
      // 보내고 있으므로 같은 키의 반복은 무시한다.
      if (e.repeat || heldKey === key) return;
      heldKey = key;
      startHold(key);
      highlight(key, true);
    } else {
      sendKey(key);              // w/s/r/t/c/x 는 1회성
      highlight(key, true);
      setTimeout(() => highlight(key, false), 120);
    }
  });

  document.addEventListener('keyup', e => {
    const key = keyOf(e);
    if (!key) return;
    if (HOLD_KEYS.has(key) && heldKey === key) {
      heldKey = null;
      stopHold();
      highlight(key, false);
    }
  });

  // 키를 누른 채 탭을 벗어나면 keyup 을 못 받는다 → 여기서도 확실히 멈춘다.
  // (stopHold 는 위의 blur 핸들러가 이미 호출한다)
  window.addEventListener('blur', () => {
    heldKey = null;
    document.querySelectorAll('#pad button.kbd')
            .forEach(b => b.classList.remove('kbd'));
  });

  // 어떤 키가 먹었는지 버튼에 표시 — 눌렀는지 아닌지 알 수 있어야 한다.
  function highlight(key, on) {
    const b = document.querySelector(`#pad button[data-key="${key}"]`);
    if (b) b.classList.toggle('kbd', on);
  }

  // ── 브라우저 오류를 서버로 보고 ─────────────────────────────────
  // 원격 브라우저의 콘솔을 볼 수 없으면 '화면이 안 된다' 는 신고를
  // 서버 로그만으로 진단할 수 없다. 오류만 보낸다(정상 동작 시 조용함).
  let lastErr = '';
  function reportErr(what) {
    if (what === lastErr) return;      // 같은 오류 반복은 한 번만
    lastErr = what;
    fetch('/clienterr', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({msg: String(what).slice(0, 300)}),
    }).catch(() => {});
  }
  window.addEventListener('error', e =>
    reportErr(`${e.message} @${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', e =>
    reportErr('unhandled: ' + (e.reason && e.reason.message || e.reason)));

  // ── 상태 폴링 (10Hz) ────────────────────────────────────────────
  // WebSocket 을 쓰지 않는 이유: 10Hz 폴링에 과하고 의존성이 늘어난다.
  // max_current_* 는 런타임에 오버라이드될 수 있다(예: 1.0A 캡 운용).
  // 서버가 활성 조종 노드에서 실제 값을 읽어 /state 에 실어 보내므로
  // 그것을 우선 쓰고, 조종 노드가 없어 null 이면 기본값으로 폴백한다.
  // 서버가 /state.control_node 로 '실제로 살아있는 조종 노드' 이름을 준다.
  // 브라우저가 스스로 추측하지 않고 이 값을 그대로 쓰는 것이 핵심이다 —
  // 그래야 새로고침해도, 모드를 바꿔도 항상 실제 노드를 가리킨다.
  //
  // 선언이 반드시 poll() 보다 위에 있어야 한다. let 은 TDZ 가 있어서
  // 선언 전에 대입하면 ReferenceError 로 poll() 전체가 죽고, 그러면
  // refreshTune() 도 노드 상태 갱신도 전부 멈춘다(실측한 버그).
  let serverControlNode = null;
  // nodeState 도 poll() 이 대입하므로 같은 이유로 여기서 선언해야 한다.
  let nodeState = {};

  const T_LIMITS_DEFAULT = [3.0, 3.0, 3.0, 3.0, 5.0, 5.0];
  let T_LIMITS = T_LIMITS_DEFAULT;
  const hist = {yaw: [], depth: []};
  const HIST_MAX = 300;   // 30초 × 10Hz

  function fmt(v, digits, unit) {
    if (v === null || v === undefined) return '–';
    return v.toFixed(digits) + (unit || '');
  }

  function setText(id, text, dead) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.classList.toggle('dead', !!dead);
  }

  function buildThrusters() {
    const box = document.getElementById('thrusters');
    box.innerHTML = '';
    for (let i = 0; i < 6; i++) {
      const row = document.createElement('div');
      row.className = 'tbar';
      row.innerHTML =
        `<span class="name">T${i + 1}</span>` +
        `<span class="track"><span class="fill" id="tf${i}"></span></span>` +
        `<span class="val" id="tv${i}">–</span>`;
      box.appendChild(row);
    }
  }
  buildThrusters();

  function drawThrusters(cur) {
    for (let i = 0; i < 6; i++) {
      const fill = document.getElementById('tf' + i);
      const val = document.getElementById('tv' + i);
      if (!cur) { fill.style.width = '0'; val.textContent = '–'; continue; }
      const a = cur[i] || 0;
      // 중앙 기준 좌우 확장. 한계 대비 비율로 폭을 정해 포화가 눈에 보인다.
      const frac = Math.min(Math.abs(a) / T_LIMITS[i], 1) * 50;
      fill.style.width = frac + '%';
      fill.style.left = a >= 0 ? '50%' : (50 - frac) + '%';
      fill.style.background = Math.abs(a) >= T_LIMITS[i] * 0.98
        ? '#f44' : '#4af';
      val.textContent = a.toFixed(2) + 'A';
    }
  }

  function drawChart() {
    const c = document.getElementById('chart');
    const g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);

    // 0 기준선
    g.strokeStyle = '#444';
    g.beginPath();
    g.moveTo(0, c.height / 2);
    g.lineTo(c.width, c.height / 2);
    g.stroke();

    const series = [
      {data: hist.yaw, color: '#4af', scale: 30},   // ±30° 를 화면 절반
      {data: hist.depth, color: '#fa4', scale: 0.5}, // ±0.5m
    ];
    for (const s of series) {
      if (s.data.length < 2) continue;
      g.strokeStyle = s.color;
      g.beginPath();
      s.data.forEach((v, i) => {
        const x = (i / (HIST_MAX - 1)) * c.width;
        const y = c.height / 2
                - Math.max(-1, Math.min(1, v / s.scale)) * (c.height / 2 - 4);
        i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      });
      g.stroke();
    }
  }

  function push(arr, v) {
    arr.push(v);
    while (arr.length > HIST_MAX) arr.shift();
  }

  async function poll() {
    let s;
    try {
      s = await (await fetch('/state')).json();
    } catch (e) {
      setText('cam-status', '서버 연결 끊김', true);
      return;
    }

    // 카메라 생존
    if (!s.camera.alive) {
      status.textContent = s.camera.age === null
        ? '영상 없음 — laser_camera_publisher 가 떠 있는지 확인하세요.'
        : `영상 정지 ${s.camera.age}초 — 카메라 노드를 확인하세요.`;
      status.classList.add('dead');
    } else {
      status.textContent = '';
      status.classList.remove('dead');
    }

    const y = s.yaw, d = s.depth, w = s.wall;
    setText('v-yaw-t', y ? fmt(y[0], 1, '°') : '–', !y);
    setText('v-yaw-c', y ? fmt(y[1], 1, '°') : '–', !y);
    setText('v-yaw-e', y ? fmt(y[2], 1, '°') : '–', !y);
    setText('v-dep-t', d ? fmt(d[0], 2, 'm') : '–', !d);
    setText('v-dep-c', d ? fmt(d[1], 2, 'm') : '–', !d);
    setText('v-pres', d ? fmt(d[5] / 1000, 1, 'kPa') : '–', !d);
    setText('v-dvl-x', y ? fmt(y[8], 3, 'm/s') : '–', !y);
    setText('v-dvl-y', y ? fmt(y[9], 3, 'm/s') : '–', !y);
    setText('v-pitch', y ? fmt(y[6], 1, '°') : '–', !y);
    setText('v-sonar', w ? fmt(w[1], 2, 'm') : '–', !w);
    setText('v-conf', w ? fmt(w[4], 0, '%') : '–', !w);
    setText('v-wmode', s.wall_mode || '–', !s.wall_mode);

    T_LIMITS = s.max_current || T_LIMITS_DEFAULT;
    serverControlNode = s.control_node || null;
    paintLed(s.led);
    if (s.nodes) { nodeState = s.nodes; paintNodes(); }
    refreshTune();   // control_node 가 바뀌면 슬라이더를 다시 만든다
    drawThrusters(s.thrusters);
    push(hist.yaw, y ? y[2] : 0);
    push(hist.depth, d ? d[2] : 0);
    drawChart();
  }

  setInterval(poll, 100);
  poll();

  // ── 노드 토글 ───────────────────────────────────────────────────
  // 그룹이 같은 노드는 서버가 상호배타를 강제한다. UI 도 같은 그룹을
  // 한 상자에 묶어 사용자가 충돌 조합을 만들 수 없다는 걸 보이게 한다.
  const NODE_GROUPS = [
    {title: '센서 (자유롭게 켜고 끄기)',
     keys: ['pressure', 'dvl', 'imu', 'led', 'sonar'], ledSlider: true},
    {title: '측위 — 하나만 (stellarHD 카메라 공유)',
     keys: ['localization', 'aruco']},
    {title: '조종 — 하나만 (CAN 버스 공유)',
     keys: ['teleop', 'wall_align'], currentLimit: true},
  ];
  const NODE_LABELS = {
    pressure: '압력 (Bar10XT)', dvl: 'DVL-A50', imu: 'IMU (GV7-INS)',
    led: 'Lumen LED', sonar: 'Ping1D 소나',
    localization: '측위 (UKFM + ArUco)', aruco: 'ArUco 단독',
    teleop: '수동 조종 (teleop)', wall_align: '벽면 정렬 (wall_align)',
  };
  // 서버의 CONTROL_NODE_NAMES 와 정확히 일치해야 한다.
  const CONTROL_NODE_NAMES = {
    teleop: 'keyboard_control_teleop',
    wall_align: 'keyboard_control_wall_align',
  };

  function buildNodes() {
    const box = document.getElementById('nodes');
    box.innerHTML = '';
    for (const g of NODE_GROUPS) {
      const fs = document.createElement('fieldset');
      fs.className = 'nodegrp';
      fs.innerHTML = `<legend>${g.title}</legend>`;
      if (g.currentLimit) {
        // 전류 한계는 축별로 둘 — heave 는 부력을 이겨야 해 더 크다.
        // 물 밖 벤치에서 시험할 때는 두 값을 낮춰서 켠다.
        fs.innerHTML +=
          `<label>수평 <input type="number" id="max-current-horiz" ` +
          `min="0.1" max="5.0" step="0.1" value="3.0"> A</label> ` +
          `<label>상하 <input type="number" id="max-current-heave" ` +
          `min="0.1" max="5.0" step="0.1" value="5.0"> A</label> `;
      }
      if (g.ledSlider) {
        // LED 는 파라미터가 아니라 lumen/brightness 토픽이라 전용 경로다.
        fs.innerHTML +=
          `<label id="led-wrap">밝기 <input type="range" id="led" ` +
          `min="0" max="1" step="0.01" value="0" disabled>` +
          `<span id="led-val">–</span></label> `;
      }
      for (const k of g.keys) {
        const b = document.createElement('button');
        b.className = 'nodebtn';
        b.id = 'nb-' + k;
        b.textContent = NODE_LABELS[k];
        b.addEventListener('click', () => toggleNode(k));
        fs.appendChild(b);
      }
      box.appendChild(fs);
    }
  }
  buildNodes();

  // ── 카메라 노출·감마 ───────────────────────────────────────────
  // laser_camera_publisher 의 ROS 파라미터를 그대로 쓴다(정수).
  // 드래그 중 연속 전송하되 20Hz 로 제한 — v4l2-ctl 호출이 매번
  // subprocess 라 그보다 자주 보내면 카메라 노드가 밀린다.
  const CAM_MIN_INTERVAL = 50;
  const camState = {exposure: {last: 0, pending: null},
                    gamma: {last: 0, pending: null}};

  function camFlush(name) {
    const st = camState[name];
    if (st.pending === null) return;
    const v = st.pending; st.pending = null; st.last = Date.now();
    fetch('/param', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(
        {node: 'laser_camera_publisher', name: name, value: v}),
    }).then(r => r.json()).then(r => {
      if (!r.ok) console.warn('camera', name, r.msg);
    }).catch(() => {});
  }

  function camSend(name, v) {
    const st = camState[name];
    st.pending = v;
    const wait = CAM_MIN_INTERVAL - (Date.now() - st.last);
    if (wait <= 0) camFlush(name); else setTimeout(() => camFlush(name), wait);
  }

  [['cam-exp', 'exposure'], ['cam-gam', 'gamma']].forEach(([id, name]) => {
    const el = document.getElementById(id);
    const num = document.getElementById(id + '-v');
    if (!el || !num) return;
    // 슬라이더와 숫자 입력을 양방향으로 묶는다 — 어느 쪽을 바꿔도 반영된다.
    const apply = (v, from) => {
      v = parseInt(v, 10);
      if (isNaN(v)) return;                      // 지우는 중이면 무시
      const lo = parseInt(el.min, 10), hi = parseInt(el.max, 10);
      v = Math.max(lo, Math.min(hi, v));         // 범위를 벗어나면 자른다
      if (from !== 'range') el.value = v;
      if (from !== 'number') num.value = v;
      camSend(name, v);
    };
    el.addEventListener('input', () => apply(el.value, 'range'));
    // change 만 듣는다 — 타이핑 중(input)마다 보내면 '5' 를 치는 순간
    // 50 이 아니라 5 가 적용된다.
    num.addEventListener('change', () => apply(num.value, 'number'));
  });

  // ── LED 밝기 ────────────────────────────────────────────────────
  // 드래그 중 연속 전송하되 조종 키와 같은 20Hz 로 제한한다 — 슬라이더
  // input 이벤트는 그보다 훨씬 자주 뜨므로 그대로 보내면 낭비다.
  // 드래그하는 동안에는 서버가 보내주는 값으로 슬라이더를 되돌리지 않는다
  // (손으로 잡고 있는 걸 1Hz state 가 뒤로 끌어당기면 조작이 튄다).
  const LED_MIN_INTERVAL = 50;   // ms → 20Hz
  let ledLastSent = 0, ledPending = null, ledDragging = false;

  function ledFlush() {
    if (ledPending === null) return;
    const v = ledPending; ledPending = null; ledLastSent = Date.now();
    fetch('/led', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({value: v}),
    }).then(r => r.json()).then(r => {
      if (!r.ok) console.warn('LED:', r.msg);
    }).catch(() => {});
  }

  function ledSend(v) {
    ledPending = v;
    const wait = LED_MIN_INTERVAL - (Date.now() - ledLastSent);
    if (wait <= 0) ledFlush(); else setTimeout(ledFlush, wait);
  }

  const ledEl = document.getElementById('led');
  const ledValEl = document.getElementById('led-val');
  if (ledEl) {
    ledEl.addEventListener('input', () => {
      ledDragging = true;
      ledValEl.textContent = parseFloat(ledEl.value).toFixed(2);
      ledSend(parseFloat(ledEl.value));
    });
    // 떼는 순간 마지막 값을 확실히 보낸다(throttle 로 밀린 값 보정).
    ['pointerup', 'change', 'blur'].forEach(ev =>
      ledEl.addEventListener(ev, () => {
        ledDragging = false;
        ledSend(parseFloat(ledEl.value));
      }));
  }

  function paintLed(v) {
    if (!ledEl) return;
    const alive = (v !== null && v !== undefined);
    ledEl.disabled = !alive;
    if (!alive) { ledValEl.textContent = '–'; return; }
    ledValEl.textContent = v.toFixed(2);
    if (!ledDragging) ledEl.value = v;   // 조작 중엔 되돌리지 않는다
  }

  async function toggleNode(key) {
    // 누르면 항상 서버로 보낸다 — curl 로 직접 호출할 때와 같은 동작.
    // 중복 기동 방지는 서버의 _present() 가 이미 하므로 브라우저에서
    // 연타를 막을 필요가 없다(막으면 정당한 두 번째 클릭도 삼킨다).
    const btn = document.getElementById('nb-' + key);
    btn.disabled = true;
    try {
      // '켜짐' 판정을 화면 표시와 똑같은 근거로 한다. 조종 그룹은
      // control_node(실제로 살아있는 노드)가 기준이고 센서는 nodeState 다.
      // 전에는 항상 nodeState 만 봤는데, 조종 노드가 살아있어도
      // nodeState[key] 가 false 인 순간이 있어 '켜기' 를 다시 보냈고
      // 그때마다 노드가 재기동됐다(로그에 시작 3연속, 종료 없음).
      const isControl = (key === 'teleop' || key === 'wall_align');
      const isOn = isControl
        ? CONTROL_NODE_NAMES[key] === serverControlNode
        : !!nodeState[key];
      const body = {key: key, on: !isOn};
      // control 그룹을 켤 때만 전류 한계를 함께 보낸다.
      if (!isOn && isControl) {
        const h = document.getElementById('max-current-horiz');
        const v = document.getElementById('max-current-heave');
        if (h) body.max_current_horiz = parseFloat(h.value);
        if (v) body.max_current_heave = parseFloat(v.value);
      }
      const r = await (await fetch('/node', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      })).json();
      if (!r.ok) alert(r.msg);
      nodeState = r.nodes || nodeState;
      // 모드를 바꿨으니 이전 노드의 슬라이더는 무효다. tuneNode 와 재시도
      // 대기를 비워 새 노드를 즉시 조회하게 한다.
      if (isControl) { tuneNode = null; tuneRetryAt = 0; }
      paintNodes();
      refreshTune();
    } finally {
      btn.disabled = false;
    }
  }

  function paintNodes() {
    for (const k in NODE_LABELS) {
      const b = document.getElementById('nb-' + k);
      if (!b) continue;
      // 조종 그룹(teleop/wall_align)은 서버가 상호배타를 강제하므로 절대
      // 둘이 동시에 켜져 보여선 안 된다. 그래서 control_node(실제로 살아있는
       // 노드) 하나만 신뢰하고, 장부(nodeState)와 OR 하지 않는다 — OR 하면
      // 전환 직후 새 노드는 장부에서 on, 옛 노드는 control_node 에 아직
      // 남아 둘 다 켜진 것처럼 보인다(실측 확인).
      const isControl = (k === 'teleop' || k === 'wall_align');
      const on = isControl
        ? CONTROL_NODE_NAMES[k] === serverControlNode
        : !!nodeState[k];
      b.classList.toggle('on', on);
    }
  }

  // ── 게인 튜닝 ───────────────────────────────────────────────────
  // 파라미터 목록을 하드코딩하지 않는다 — 서버가 노드에서 직접 읽어온다.
  // 노드마다 선언 집합이 다르고(teleop 약 40, wall_align 약 60),
  // read_only 로 표시된 물성값은 서버가 이미 걸러낸다.
  let tuneNode = null;

  function activeControlNode() {
    if (serverControlNode) return serverControlNode;
    if (nodeState.teleop) return CONTROL_NODE_NAMES.teleop;
    if (nodeState.wall_align) return CONTROL_NODE_NAMES.wall_align;
    return null;
  }

  // 재시도는 1초에 한 번으로 제한한다 — poll() 이 10Hz 라 그대로 두면
  // 노드가 준비되기 전 2초간 서버에 20번 헛되이 물어본다.
  let tuneRetryAt = 0;
  // poll() 이 10Hz 로 refreshTune() 을 await 없이 부른다. async 함수라
  // fetch 를 기다리는 동안 다음 호출이 겹쳐 들어와, 서로 tuneNode 를
  // 덮어쓰며 경쟁한다(슬라이더를 만드는 중에 다른 호출이 지워버리기도
  // 한다). 한 번에 하나만 돌게 잠근다.
  let tuneBusy = false;

  // 실패로 tuneNode 를 null 로 되돌린 상태와 "원래 노드가 없는" 상태를
  // 구분한다. 둘 다 null 이면 target===tuneNode 로 조기 반환되어, 노드를
  // 끈 뒤에도 이전 실패 문구가 화면에 남는다(실측).
  let dbgLast = '';
  function dbg(why) {
    if (why === dbgLast) return;      // 같은 사유 반복은 한 번만
    dbgLast = why;
    fetch('/clienterr', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({msg: 'tune: ' + why}),
    }).catch(() => {});
  }

  async function refreshTune() {
    if (tuneBusy) { dbg('busy'); return; }
    const target = activeControlNode();
    // tuneNode 에는 '성공적으로 슬라이더를 만든 노드' 만 기록한다. 실패하면
    // 손대지 않으므로 target !== tuneNode 가 유지되고, 다음 폴링에서 자연히
    // 재시도된다 — 플래그 조합으로 재시도 여부를 판단하지 않는다.
    if (target === tuneNode) { dbg('same:' + target); return; }
    if (target && Date.now() < tuneRetryAt) {
      dbg('wait:' + Math.round(tuneRetryAt - Date.now()) + 'ms');
      return;
    }
    dbg('go:' + target);
    tuneBusy = true;
    try {
      await _refreshTuneInner(target);
    } finally {
      tuneBusy = false;
    }
  }

  async function _refreshTuneInner(target) {
    const sl = document.getElementById('sliders');
    const st = document.getElementById('tune-status');
    sl.innerHTML = '';
    if (!target) {
      st.textContent = '조종 노드를 켜면 게인 슬라이더가 나타납니다.';
      st.classList.remove('msg-err');   // 이전 실패의 빨간 글씨를 지운다
      pmsg.textContent = '';            // 프리셋 쪽 안내도 함께 정리
      pmsg.classList.remove('msg-err');
      tuneNode = null;                  // '노드 없음' 상태를 확정
      return;
    }
    st.textContent = `${target} 파라미터를 읽는 중…`;
    let r;
    try {
      r = await (await fetch(
        '/params?node=' + encodeURIComponent(target))).json();
    } catch (e) {
      // tuneNode 는 그대로 둔다 — target 과 다르므로 다음 폴링에서 재시도된다
      tuneRetryAt = Date.now() + 400;
      return;
    }
    if (!r.ok) {
      dbg('fail:' + r.msg);
      // 노드가 뜬 직후에는 파라미터 서비스가 아직 안 올라와 실패한다
      // (실측 ~2초). tuneNode 를 되돌려 다음 폴링(0.1초 후)에 재시도하게
      // 한다 — 안 그러면 target===tuneNode 로 조기 반환해 영구히 에러가
      // 남는다.
      st.textContent = r.msg + ' (재시도 중…)';
      st.classList.add('msg-err');
      tuneRetryAt = Date.now() + 400;
      return;
    }
    st.classList.remove('msg-err');
    st.textContent = `${target} — ${r.params.length}개 파라미터`;
    tuneNode = target;                  // 성공했을 때만 기록
    dbg('ok:' + r.params.length);

    for (const p of r.params) {
      // 범위는 현재 값 기준으로 잡는다. 0 이면 고정 범위를 준다.
      const base = Math.abs(p.value) > 1e-9 ? Math.abs(p.value) : 1;
      const max = base * 4, step = p.type === 'integer' ? 1 : base / 200;
      const row = document.createElement('div');
      row.className = 'slider';
      row.innerHTML =
        `<label for="sr-${p.name}">${p.name}</label>` +
        `<input type="range" id="sr-${p.name}" min="0" max="${max}"` +
        ` step="${step}" value="${p.value}">` +
        `<input type="number" id="sn-${p.name}" step="${step}"` +
        ` value="${p.value}">`;
      document.getElementById('sliders').appendChild(row);

      const range = document.getElementById('sr-' + p.name);
      const num = document.getElementById('sn-' + p.name);
      const apply = v => {
        range.value = v; num.value = v;
        fetch('/param', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(
            {node: target, name: p.name, value: parseFloat(v)}),
        }).then(r => r.json()).then(r => {
          if (!r.ok) { st.textContent = r.msg; st.classList.add('msg-err'); }
        }).catch(() => {});
      };
      range.addEventListener('input', () => apply(range.value));
      num.addEventListener('change', () => apply(num.value));
    }
  }

  // ── 프리셋 ──────────────────────────────────────────────────────
  const pmsg = document.getElementById('preset-msg');

  async function presetCall(action, name) {
    const target = activeControlNode();
    // list 는 저장된 파일 이름만 읽으므로 조종 노드가 없어도 된다.
    // save/load 만 대상 노드가 필요하다 — 페이지 로드 직후에는 poll() 의
    // 첫 응답이 아직 안 와서 target 이 null 이므로, 여기서 노드를 요구하면
    // 노드가 켜져 있어도 '먼저 켜세요' 가 뜬다.
    if (!target && action !== 'list') {
      pmsg.textContent = '조종 노드를 먼저 켜세요';
      return;
    }
    const r = await (await fetch('/preset', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: action, name: name, node: target}),
    })).json();
    pmsg.textContent = r.msg || '';
    pmsg.classList.toggle('msg-err', !r.ok);
    const sel = document.getElementById('preset-sel');
    sel.innerHTML = '';
    for (const p of (r.presets || [])) {
      const o = document.createElement('option');
      o.value = o.textContent = p;
      sel.appendChild(o);
    }
    if (action === 'load' && r.ok) { tuneNode = null; refreshTune(); }
  }

  document.getElementById('preset-save').addEventListener('click', () => {
    const n = document.getElementById('preset-name').value.trim();
    if (!n) { pmsg.textContent = '이름을 입력하세요'; return; }
    presetCall('save', n);
  });
  document.getElementById('preset-load').addEventListener('click', () => {
    const n = document.getElementById('preset-sel').value;
    if (!n) { pmsg.textContent = '불러올 프리셋이 없습니다'; return; }
    presetCall('load', n);
  });
  // 초기 프리셋 목록은 poll() 첫 응답 뒤에 부른다 — 그때 serverControlNode
  // 가 채워져 있어 save/load 대상 노드도 정확히 잡힌다.
  setTimeout(() => presetCall('list', ''), 300);
</script>
</body>
